<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <main class="admin-center">
        <h1>Cadastro de Clientes</h1>

        <div class="form-row">
            <label>Nome para cadastrar:</label>
            <input type="text" id="nome" placeholder="Digite o nome do Cliente">
        </div>

        <div class="form-row">
            <button class="button button-secondary" onclick="listarclientes()">Listar Clientes</button>
            <button class="button button-primary" onclick="cadastrarCliente()">Cadastrar Cliente</button>
        </div>

        <hr>

        <div class="form-row">
            <label>Nome para buscar:</label>
            <input type="text" id="searchNome" placeholder="Digite o nome para buscar">
            <button class="button button-primary" onclick="buscarCliente()">Buscar Cliente</button>
        </div>

        <hr>

        <ul id="lista"></ul>
    </main>

    <script src="script.js"></script>
</body>
</html>
